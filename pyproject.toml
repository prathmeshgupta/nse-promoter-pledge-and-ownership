[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nse-promoter-pledge-and-ownership"
version = "0.1.0"
description = "NSE quarterly promoter holding, pledged shares percentage, and institutional ownership tracker"
authors = [{ name = "Prathmesh Gupta" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "numpy>=1.24.0",
    "yfinance>=0.2.38"
]

[tool.setuptools.packages.find]
where = ["src"]
